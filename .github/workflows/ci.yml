# SPDX-License-Identifier: MPL-2.0
name: Core checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, CPython ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            version: '3.12'
            shell: bash
            base: python3.12
            python: ./.venv/bin/python
            cli: ./.venv/bin/corinthos
          - os: windows-latest
            version: '3.12'
            shell: pwsh
            base: python
            python: ./.venv/Scripts/python.exe
            cli: ./.venv/Scripts/corinthos.exe
          - os: ubuntu-latest
            version: '3.14.10'
            shell: bash
            base: python3.14
            python: ./.venv/bin/python
            cli: ./.venv/bin/corinthos
          - os: windows-latest
            version: '3.14.10'
            shell: pwsh
            base: python
            python: ./.venv/Scripts/python.exe
            cli: ./.venv/Scripts/corinthos.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Create clean virtual environment
        run: ${{ matrix.base }} -m venv .venv
      - name: Verify virtual environment and Python version
        env:
          CORINTHOS_CI_PYTHON: ${{ matrix.version }}
        run: |
          ${{ matrix.python }} -c "
          import os
          import platform
          import sys
          from pathlib import Path
          expected = Path.cwd() / '.venv'
          version = tuple(map(int, os.environ['CORINTHOS_CI_PYTHON'].split('.')))
          assert sys.version_info[:len(version)] == version
          assert sys.prefix != sys.base_prefix
          assert Path(sys.prefix).resolve() == expected.resolve()
          assert Path(sys.executable).absolute().is_relative_to(expected.absolute())
          print(platform.platform())
          print(sys.version)
          print('Interpreter:', Path(sys.executable).relative_to(Path.cwd()))
          "
      - name: Record virtual environment pip version
        run: ${{ matrix.python }} -m pip --version
      - name: Install package and development tools
        run: ${{ matrix.python }} -m pip install -e ".[dev]"
      - name: Build package wheel
        run: ${{ matrix.python }} -m pip wheel . --no-deps --wheel-dir .venv/wheelhouse
      - name: Install built wheel
        run: ${{ matrix.python }} -m pip install --no-index --no-deps --force-reinstall --find-links .venv/wheelhouse corinthos-core
      - name: Check dependency consistency
        run: ${{ matrix.python }} -m pip check
      - name: Verify installed wheel imports
        run: |
          ${{ matrix.python }} -c "
          import sys
          from pathlib import Path
          import corinthos
          import corinthos.adapters
          import corinthos.workflow
          import corinthos.validation.runtime
          import corinthos.report.service
          for module in (corinthos, corinthos.adapters, corinthos.workflow, corinthos.validation.runtime, corinthos.report.service):
              origin = Path(module.__file__).resolve()
              assert origin.is_relative_to(Path(sys.prefix).resolve()), origin
              print(module.__name__, origin)
          "
      - name: Verify CLI help
        run: ${{ matrix.python }} -m corinthos --help
      - name: Verify console entry point
        run: ${{ matrix.cli }} --version
      - name: Verify Project Manager commands
        run: |
          ${{ matrix.python }} -m corinthos project --help
          ${{ matrix.python }} -m corinthos project start --help
      - name: Verify Phase 2 CLI commands
        run: |
          ${{ matrix.python }} -m corinthos project summary --help
          ${{ matrix.python }} -m corinthos projects list --help
          ${{ matrix.python }} -m corinthos work create --help
      - name: Verify Phase 4 CLI commands
        run: |
          ${{ matrix.python }} -m corinthos context --help
          ${{ matrix.python }} -m corinthos handoff --help
      - name: Verify Phase 5 CLI commands
        run: |
          ${{ matrix.python }} -m corinthos switch start --help
          ${{ matrix.python }} -m corinthos switch status --help
      - name: Verify Phase 6 CLI commands
        run: |
          ${{ matrix.python }} -m corinthos scope assess --help
          ${{ matrix.python }} -m corinthos flow status --help
          ${{ matrix.python }} -m corinthos work report --help
      - name: Verify Phase 7 CLI commands
        run: |
          ${{ matrix.python }} -m corinthos import inspect --help
          ${{ matrix.python }} -m corinthos import commit --help
          ${{ matrix.python }} -m corinthos import status --help
          ${{ matrix.python }} -m corinthos import refresh --help
          ${{ matrix.python }} -m corinthos import files --help
      - name: Verify Workflow commands
        run: |
          ${{ matrix.python }} -m corinthos workflow --help
          ${{ matrix.python }} -m corinthos workflow plan --help
          ${{ matrix.python }} -m corinthos workflow execute --help
          ${{ matrix.python }} -m corinthos workflow recover --help
          ${{ matrix.python }} -m corinthos workflow reconcile --help
      - name: Verify Validation commands
        run: |
          ${{ matrix.python }} -m corinthos validation --help
          ${{ matrix.python }} -m corinthos validation plan --help
          ${{ matrix.python }} -m corinthos validation run --help
          ${{ matrix.python }} -m corinthos validation recover --help
      - name: Verify Report commands
        run: |
          ${{ matrix.python }} -m corinthos report --help
          ${{ matrix.python }} -m corinthos report generate --help
          ${{ matrix.python }} -m corinthos report export --help
          ${{ matrix.python }} -m corinthos report recover --help
          ${{ matrix.python }} -m corinthos report compare --help
      - name: Run all tests
        run: ${{ matrix.python }} -m pytest
      - name: Verify installed lifecycle outside checkout
        run: ${{ matrix.python }} -I -B examples/installed_bootstrap.py
      - name: Run the contract kernel demonstration
        run: ${{ matrix.python }} examples/contract_kernel.py
      - name: Check lint
        run: ${{ matrix.python }} -m ruff check .
      - name: Check formatting
        run: ${{ matrix.python }} -m ruff format --check .
      - name: Verify Bash activation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source .venv/bin/activate
          python -c "import sys; from pathlib import Path; assert sys.prefix != sys.base_prefix; assert Path(sys.prefix).resolve() == (Path.cwd() / '.venv').resolve(); print(sys.executable)"
          deactivate
      - name: Verify POSIX sh activation
        if: runner.os == 'Linux'
        shell: sh
        run: |
          . .venv/bin/activate
          python -c "import sys; from pathlib import Path; assert sys.prefix != sys.base_prefix; assert Path(sys.prefix).resolve() == (Path.cwd() / '.venv').resolve(); print(sys.executable)"
          deactivate
      - name: Verify PowerShell activation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./.venv/Scripts/Activate.ps1
          python -c "import sys; from pathlib import Path; assert sys.prefix != sys.base_prefix; assert Path(sys.prefix).resolve() == (Path.cwd() / '.venv').resolve(); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deactivate
  source-install:
    name: Verify Windows source installation (CPython 3.14.10 embeddable)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        shell: pwsh
        run: git rev-parse HEAD
      - name: Install, exercise, reinstall and uninstall in a disposable user scope
        shell: powershell
        run: .\platform\windows\test-install.ps1
  desktop:
    name: Verify Windows desktop Projects, Agents and Context
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Fetch exact v8 desktop fixture sources
        run: git fetch --no-tags origin 13e7bf556788e737493d767b30e12a6613c8fa73
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
      - name: Verify frontend and build Tauri
        working-directory: apps/desktop
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = '1.99.1'
          "RUSTUP_TOOLCHAIN=1.99.1" >> $env:GITHUB_ENV
          node --version
          npm --version
          rustc --version
          cargo --version
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run tauri -- build --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Rust bridge supervision
        run: |
          $env:CORINTHOS_SIDECAR_TEST_PYTHON = (Get-Command python.exe -ErrorAction Stop).Source
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features
      - name: Build the WebView test observer
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --release --features desktop-smoke,custom-protocol
      - name: Verify desktop Projects, Agents and Context with the private Python runtime
        shell: powershell
        run: .\apps\desktop\test-windows.ps1 -Desktop .\apps\desktop\src-tauri\target\release\corinthos-desktop.exe
