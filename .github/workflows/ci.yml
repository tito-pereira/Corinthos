# SPDX-License-Identifier: MPL-2.0
name: Core checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, CPython ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            version: '3.12'
            shell: bash
            base: python3.12
            python: ./.venv/bin/python
            cli: ./.venv/bin/corinthos
          - os: windows-latest
            version: '3.12'
            shell: pwsh
            base: python
            python: ./.venv/Scripts/python.exe
            cli: ./.venv/Scripts/corinthos.exe
          - os: ubuntu-latest
            version: '3.14.10'
            shell: bash
            base: python3.14
            python: ./.venv/bin/python
            cli: ./.venv/bin/corinthos
          - os: windows-latest
            version: '3.14.10'
            shell: pwsh
            base: python
            python: ./.venv/Scripts/python.exe
            cli: ./.venv/Scripts/corinthos.exe
          - os: ubuntu-latest
            version: '3.15'
            shell: bash
            base: python3.15
            python: ./.venv/bin/python
            cli: ./.venv/bin/corinthos
          - os: windows-latest
            version: '3.15'
            shell: pwsh
            base: python
            python: ./.venv/Scripts/python.exe
            cli: ./.venv/Scripts/corinthos.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}
      - name: Record tested commit
        run: |
          git rev-parse HEAD
          git --version
      - name: Create clean virtual environment
        run: ${{ matrix.base }} -m venv .venv
      - name: Verify virtual environment and Python version
        env:
          CORINTHOS_CI_PYTHON: ${{ matrix.version }}
        run: |
          ${{ matrix.python }} -c "
          import os
          import platform
          import sys
          from pathlib import Path
          expected = Path.cwd() / '.venv'
          version = tuple(map(int, os.environ['CORINTHOS_CI_PYTHON'].split('.')))
          assert sys.version_info[:len(version)] == version
          assert sys.prefix != sys.base_prefix
          assert Path(sys.prefix).resolve() == expected.resolve()
          assert Path(sys.executable).absolute().is_relative_to(expected.absolute())
          print(platform.platform())
          print(sys.version)
          print('Interpreter:', Path(sys.executable).relative_to(Path.cwd()))
          "
      - name: Record virtual environment pip version
        run: ${{ matrix.python }} -m pip --version
      - name: Install package and development tools
        run: ${{ matrix.python }} -m pip install -e ".[dev]"
      - name: Build package wheel
        run: ${{ matrix.python }} -m pip wheel . --no-deps --wheel-dir .venv/wheelhouse
      - name: Install built wheel
        run: ${{ matrix.python }} -m pip install --no-index --no-deps --force-reinstall --find-links .venv/wheelhouse corinthos-core
      - name: Check dependency consistency
        run: ${{ matrix.python }} -m pip check
      - name: Verify installed wheel and complete blueprint
        run: |
          ${{ matrix.python }} -I -c "import sys; from pathlib import Path; import corinthos, corinthos.runtime, corinthos.application.sidecar; from importlib.resources import files; assert Path(corinthos.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); assert len(list(files('corinthos.resources').joinpath('blueprint/.agents/skills').iterdir())) == 17"
      - name: Verify replacement CLI
        run: |
          ${{ matrix.cli }} --version
          ${{ matrix.python }} -m corinthos --help
          ${{ matrix.python }} -m corinthos skill run --help
          ${{ matrix.python }} -m corinthos cleanup planning --help
      - name: Verify current workspace, workers, continuity and Update
        run: ${{ matrix.python }} -m pytest --basetemp build/test-temp
      - name: Check lint
        run: ${{ matrix.python }} -m ruff check .
      - name: Check formatting
        run: ${{ matrix.python }} -m ruff format --check .
      - name: Verify Bash activation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source .venv/bin/activate
          python -c "import sys; from pathlib import Path; assert sys.prefix != sys.base_prefix; assert Path(sys.prefix).resolve() == (Path.cwd() / '.venv').resolve(); print(sys.executable)"
          deactivate
      - name: Verify POSIX sh activation
        if: runner.os == 'Linux'
        shell: sh
        run: |
          . .venv/bin/activate
          python -c "import sys; from pathlib import Path; assert sys.prefix != sys.base_prefix; assert Path(sys.prefix).resolve() == (Path.cwd() / '.venv').resolve(); print(sys.executable)"
          deactivate
      - name: Verify PowerShell activation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./.venv/Scripts/Activate.ps1
          python -c "import sys; from pathlib import Path; assert sys.prefix != sys.base_prefix; assert Path(sys.prefix).resolve() == (Path.cwd() / '.venv').resolve(); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deactivate
  source-install:
    name: Verify installed Windows product and release candidate
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        shell: pwsh
        run: git rev-parse HEAD
      - name: Verify the hosted runner's Windows build prerequisites
        shell: powershell
        run: |
          . .\platform\windows\common.ps1
          . .\platform\windows\toolchain.ps1
          $msvc = Find-CorinthosMsvc
          $sdk = Get-WindowsSdkBuild
          $webview = Get-CorinthosWebView2
          if (!$msvc -or !$sdk -or !$webview) {
            throw "Hosted runner prerequisite missing (MSVC: $([bool]$msvc), SDK: $([bool]$sdk), WebView2: $([bool]$webview))."
          }
          Write-Host "MSVC $($msvc.Version), Windows SDK $($sdk.Version), WebView2 $webview"
      - name: Build, exercise, reinstall and uninstall the installed product
        shell: powershell
        env:
          CORINTHOS_CI_ARTIFACTS: ${{ runner.temp }}/corinthos-release-candidate
        run: .\platform\windows\test-install.ps1
      - name: Upload tested Windows release candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corinthos-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/corinthos-release-candidate
          if-no-files-found: error
  desktop:
    name: Verify Windows desktop foundation
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
      - name: Verify frontend and build Tauri
        working-directory: apps/desktop
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = '1.99.1'
          "RUSTUP_TOOLCHAIN=1.99.1" >> $env:GITHUB_ENV
          node --version
          npm --version
          rustc --version
          cargo --version
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run tauri -- build --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Rust bridge supervision
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonExe = (Get-Command python.exe -ErrorAction Stop).Source
          & $pythonExe -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $pythonExe -I -B -X utf8 -c "import corinthos.application.sidecar"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CORINTHOS_SIDECAR_TEST_PYTHON = $pythonExe
          $testTemp = Join-Path $env:GITHUB_WORKSPACE 'build\feature-verification\ci-project-creation\temp'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify retained desktop health with the private Python runtime
        shell: powershell
        run: .\apps\desktop\test-windows.ps1 -Desktop .\apps\desktop\src-tauri\target\release\corinthos-desktop.exe
