# SPDX-License-Identifier: MPL-2.0
[package]
name = "corinthos-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:windows"]
desktop-smoke = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = ["Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }

[[bin]]
name = "corinthos-desktop"
path = "src/main.rs"
required-features = ["desktop"]
