# SPDX-License-Identifier: MPL-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corinthos-core"
dynamic = ["version"]
description = "Local project workspaces, skills and isolated provider processes."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.2,<51",
  "cffi>=2.1.1; python_version >= '3.15'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
corinthos = "corinthos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corinthos.resources" = ["*.json", "blueprint/*.md", "blueprint/*.json", "blueprint/task/*.md", "blueprint/.agents/skills/*/SKILL.md"]

[tool.setuptools.dynamic]
version = {attr = "corinthos.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
